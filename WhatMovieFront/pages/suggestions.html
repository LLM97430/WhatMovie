<div class="hero-scene py-5 text-center">
   <div class="grid hero-scene-content mx-3">
      <h1 class="g-col-12 g-col-md-8 text-center rubik-iso-regular mb-3">Out of ideas ?</h1>
      <div class="main-search-bar g-col-12 g-col-md-8 grid">
         <form class="g-col-12" role="search">
            <div class="search-field">
               <div class="search-input">
                     <input type="radio" class="btn-check" name="movie" id="movie-query" autocomplete="off" checked>
                     <label class="btn btn-secondary" for="option1">Movie</label>
                     <input type="radio" class="btn-check" name="series" id="series-query" autocomplete="off">
                     <label class="btn btn-secondary" for="option2">Series</label>
                  <input id="query-input" name="bookmark-search" class="form-control lh-lg mb-4 text-center" type="search" placeholder="Title, actor, showrunner..." aria-label="Search">
               </div>
               <div class="search-btn d-flex flex-column">
                  <button class="btn btn-primary lh-lg" id="query-btn" type="button"><i class="bi bi-search"></i> Browse</button>
               </div>
            </div>
         </form>
      </div>
   </div>
</div>
