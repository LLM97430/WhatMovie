<div class="hero-scene py-5 vh-100">
   <div class="hero-scene-content mx-3">
      <h1 class="text-center rubik-iso-regular">Update your password <span class="d-none d-md-block">to keep your account safe</span></h1>
   </div>

   <div class="container d-flex flex-column align-items-center">
      <form class="edit-password-form">
         <div class="form-floating mb-3">
            <label for="currentPasswordInput" name="currentPassword" class="form-label">Current password</label>
            <input type="password" class="form-control" id="passwordInput">
         </div>
         <div class="form-floating mb-3">
            <label for="newPasswordInput" name="newPassword" class="form-label">New password</label>
            <input type="password" class="form-control" id="newPasswordInput">
         </div>
         <div class="form-floating mb-3">
            <label for="validatePasswordInput" name="password" class="form-label">Confirm your password</label>
            <input type="password" class="form-control" id="validatePasswordInput">
         </div>
         <button type="submit" class="btn btn-primary">Update my password</button>
      </form>
   </div>
</div>
