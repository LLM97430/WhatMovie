<div class="hero-scene py-5 vh-100">
   <div class="hero-scene-content mx-3">
      <h1 class="text-center rubik-iso-regular">Sign up <span class="d-none d-md-block">to receive tailor-made suggestions</span></h1>
   </div>

   <div class="container d-flex flex-column align-items-center">
      <form class="sign-in-form">
         <div class="form-floating mt-5 mb-3">
            <label for="firstnameInput" name="firstnameInput" class="form-label">Firstname</label>
            <input type="text" class="form-control" id="firstnameInput" >
         </div>
         <div class="form-floating mb-3">
            <label for="nameInput" name="nameInput" class="form-label">Name</label>
            <input type="text" class="form-control" id="nameInput">
         </div>
         <div class="form-floating mt-5 mb-3">
            <label for="emailInput" name="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="emailInput" aria-describedby="email">
         </div>
         <div class="form-floating mb-3">
            <label for="passwordInput" name="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="passwordInput">
         </div>
         <div class="form-floating mb-3">
            <label for="validatePasswordInput" name="password" class="form-label">Confirm your password</label>
            <input type="password" class="form-control" id="validatePasswordInput">
         </div>
         <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="remember-check" id="remember-check">
            <label class="form-check-label" for="remember-check">Remember me</label>
         </div>
         <button type="submit" class="btn btn-primary">Create your WhatMovie?! account</button>
      </form>
      <div class="signup-link pt-3 text-center">
         <a href="/signin">Already subscribed ? Sign-in right here !</a>
      </div>
   </div>
</div>
